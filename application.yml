spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: speedBack
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/speedback_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:password}
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

springdoc:
  swagger-ui:
    path: /swagger
  api-docs:
    path: /api-docs

togglz:
  features:
    REMOVE_BOOKINGS:
      enabled: false
  console:
    enabled: true
    secured: false
    path: /togglz-console

management:
  endpoints:
    web:
      exposure:
        include: 'togglz'

speedback:
  slots:
    count: 3
    duration-minutes: 15

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
