spring:
  application:
    name: speedBack
  datasource:
    url: jdbc:postgresql://localhost:5433/speedback_db
    username: postgres
    password: password
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

springdoc:
  swagger-ui:
    path: /swagger
  api-docs:
    path: /api-docs

togglz:
  features:
    TESTING_TOGGLE_FEATURE:
      enabled: true
    REMOVE_BOOKINGS:
      enabled: false
  console:
    enabled: true
    secured: false
    path: /togglz-console

management:
  endpoints:
    web:
      exposure:
        include: 'togglz'
