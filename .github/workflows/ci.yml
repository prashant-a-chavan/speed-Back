name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  checks: write

jobs:
  build:
    name: Backend (Gradle)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: speedback_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d speedback_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Wait for PostgreSQL
        run: |
          for i in {1..30}; do
            nc -z localhost 5433 && echo "Postgres is up" && exit 0
            echo "Waiting for Postgres..."
            sleep 2
          done
          echo "Postgres did not become ready in time"
          exit 1

      - name: Check backend formatting
        run: ./gradlew spotlessCheck

      - name: Run backend tests
        run: ./gradlew test --console=plain

      - name: Enforce backend coverage gate (80%)
        run: ./gradlew jacocoTestReport jacocoTestCoverageVerification --console=plain

      - name: Publish backend test report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Backend Test Results
          path: build/test-results/test/*.xml
          reporter: java-junit

      - name: Build backend
        run: ./gradlew clean build -x test

      - name: Upload JaCoCo HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-jacoco-html-report
          path: build/reports/jacoco/test/html
          if-no-files-found: warn
          retention-days: 3
